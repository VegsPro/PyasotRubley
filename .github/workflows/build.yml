name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore directory and decode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/pyasotrubley.keystore
            echo "Keystore restored from secret"
          else
            echo "No KEYSTORE_BASE64 secret — release build will be skipped"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: keystore/pyasotrubley.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f keystore/pyasotrubley.keystore ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "Skipping release build (no keystore)"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PyasotRubley-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PyasotRubley-1.0.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
